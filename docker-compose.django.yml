services:
  web:
    image: nginx:1.27-alpine
    container_name: northern_times_web
    ports:
      - "8080:80"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ./docker/nginx/django.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy_params_common:/etc/nginx/proxy_params_common:ro
      - ./frontend:/app/frontend:ro
      - django_staticfiles:/app/frontend/staticfiles:ro
      - ./backend/storage/uploads:/app/backend/storage/uploads:ro
    tmpfs:
      - /tmp:size=10m
      - /var/cache/nginx:size=50m
      - /run:size=5m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: northern_times_django
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - django_staticfiles:/app/frontend/staticfiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  celery-worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: northern_times_celery_worker
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=info", "--concurrency=2", "--max-tasks-per-child=50"]
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "50"
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 10 2>/dev/null | grep -q pong"]
      interval: 120s
      timeout: 30s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G

  celery-beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: northern_times_celery_beat
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping --timeout 10 2>/dev/null | grep -q pong"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    image: pgvector/pgvector:pg15
    container_name: northern_times_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=100m
      - /run/postgresql:size=5m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: northern_times_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=10m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  mail:
    image: boky/postfix:v4.3.0
    container_name: northern_times_mail
    environment:
      ALLOWED_SENDER_DOMAINS: ${APP_DOMAIN:-localhost}
      HOSTNAME: mail.${APP_DOMAIN:-localhost}
      RELAYHOST: ""
      DKIM_SELECTOR: default
      DKIM_KEY_TABLE: "default._domainkey.${APP_DOMAIN:-localhost} ${APP_DOMAIN:-localhost}:default:/etc/opendkim/keys/${APP_DOMAIN:-localhost}/default.private"
      DKIM_SIGNING_TABLE: "*@${APP_DOMAIN:-localhost} default._domainkey.${APP_DOMAIN:-localhost}"
    volumes:
      - dkim_keys:/etc/opendkim/keys
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: northern_times_pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
      SCRIPT_NAME: ""
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: northern_times_selenium
    shm_size: "2gb"
    environment:
      SE_NODE_MAX_SESSIONS: 4
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/wd/hub/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

networks:
  northern_times:

volumes:
  pgdata:
    external: true
    name: northern-times_pgdata
  pgadmin_data:
  dkim_keys:
  redis_data:
  django_staticfiles:
