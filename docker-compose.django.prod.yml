# Production overlay — adds SSL/TLS via Certbot
# Usage: docker compose -f docker-compose.django.yml -f docker-compose.django.prod.yml up -d
services:
  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/django-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy_params_common:/etc/nginx/proxy_params_common:ro
      - ./frontend:/app/frontend:ro
      - django_staticfiles:/app/frontend/staticfiles:ro
      - ./backend/storage/uploads:/app/backend/storage/uploads:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  django:
    environment:
      SECURE_SSL_REDIRECT: "true"

  certbot:
    image: certbot/certbot:latest
    container_name: northern_times_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - northern_times
    restart: unless-stopped

volumes:
  certbot_www:
  certbot_conf:
