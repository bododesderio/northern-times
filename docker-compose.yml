services:
  web:
    image: nginx:latest
    container_name: northern_times_web
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - northern_times

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: northern_times_app
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - northern_times

  db:
    image: postgres:15-alpine
    container_name: northern_times_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - northern_times

  redis:
    image: redis:7-alpine
    container_name: northern_times_redis
    ports:
      - "6379:6379"
    networks:
      - northern_times
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: northern_times_pgadmin
    ports:
      - "5050:80"
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: "False"
      SCRIPT_NAME: ""
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - northern_times
    restart: unless-stopped

networks:
  northern_times:

volumes:
  pgdata:
  pgadmin_data: