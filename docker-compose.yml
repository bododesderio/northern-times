services:
  web:
    image: nginx:1.27-alpine
    container_name: northern_times_web
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:size=10m
      - /var/cache/nginx:size=50m
      - /run:size=5m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: northern_times_app
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);' && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  db:
    image: pgvector/pgvector:pg15
    container_name: northern_times_db
    # ports removed — DB only accessible via internal network
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=100m
      - /run/postgresql:size=5m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: northern_times_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # ports removed — Redis only accessible via internal network
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=10m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  extractor:
    build:
      context: ./docker/extractor
      dockerfile: Dockerfile
    container_name: northern_times_extractor
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]
    environment:
      APP_BOT_NAME: ${APP_BOT_NAME:-NewsCrawlerBot}
    # ports removed — extractor only accessible via internal network
    tmpfs:
      - /tmp:size=100m
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  mail:
    image: boky/postfix:v4.3.0
    container_name: northern_times_mail
    environment:
      ALLOWED_SENDER_DOMAINS: ${APP_DOMAIN:-localhost}
      HOSTNAME: mail.${APP_DOMAIN:-localhost}
      RELAYHOST: ""
      # DKIM — mount key at /etc/opendkim/keys/${APP_DOMAIN}/default.private
      DKIM_SELECTOR: default
      DKIM_KEY_TABLE: "default._domainkey.${APP_DOMAIN:-localhost} ${APP_DOMAIN:-localhost}:default:/etc/opendkim/keys/${APP_DOMAIN:-localhost}/default.private"
      DKIM_SIGNING_TABLE: "*@${APP_DOMAIN:-localhost} default._domainkey.${APP_DOMAIN:-localhost}"
    volumes:
      - dkim_keys:/etc/opendkim/keys
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "postfix status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: northern_times_pgadmin
    ports:
      - "127.0.0.1:5050:80"
    # user: root removed — runs as default non-root user
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
      SCRIPT_NAME: ""
      # CSRF and cookie protection re-enabled
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: northern_times_ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - northern_times
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  rewriter:
    build:
      context: ./docker/rewriter
      dockerfile: Dockerfile
    container_name: northern_times_rewriter
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      REWRITER_WORD_TOLERANCE: ${REWRITER_WORD_TOLERANCE:-50}
      APP_NAME: ${APP_NAME:-The Northern Times}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - northern_times
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  northern_times:

volumes:
  pgdata:
    external: true
    name: northern-times_pgdata
  pgadmin_data:
  dkim_keys:
  redis_data:
  ollama_data:
