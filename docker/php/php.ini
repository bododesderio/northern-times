; ---- Core ----
display_errors=Off
error_reporting=E_ALL
log_errors=On
memory_limit=256M
max_execution_time=30
upload_max_filesize=100M
post_max_size=110M
date.timezone=Africa/Kampala

; ---- Security defaults (production-hardened) ----
expose_php=Off
session.cookie_httponly=1
session.use_strict_mode=1
session.cookie_samesite=Lax
session.cookie_secure=1
session.gc_maxlifetime=14400
disable_functions=passthru,shell_exec,system,popen,pcntl_exec

; ---- Redis Sessions ----
; save_handler set here; save_path set in index.php to include Redis auth
session.save_handler=redis

; ---- Upload temp (optional but helpful) ----
file_uploads=On
max_file_uploads=20

; ---- OPcache (good baseline) ----
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
