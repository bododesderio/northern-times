; ---- Core ----
display_errors=Off
error_reporting=E_ALL
log_errors=On
memory_limit=1024M
max_execution_time=300
upload_max_filesize=100M
post_max_size=110M
date.timezone=Africa/Kampala

; ---- Security-ish defaults (dev-friendly, will harden for prod later) ----
expose_php=Off
session.cookie_httponly=1
session.use_strict_mode=1
session.cookie_samesite=Lax
; Set to 1 when SSL is enabled in production:
; session.cookie_secure=1

; ---- Redis Sessions ----
; Falls back to files if Redis is unavailable
session.save_handler=redis
session.save_path="tcp://redis:6379?database=0&prefix=ntsess:"

; ---- Upload temp (optional but helpful) ----
file_uploads=On
max_file_uploads=20

; ---- OPcache (good baseline) ----
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000