# Northern Times — Production Nginx Config (SSL)
#
# USAGE:
# 1. Replace YOUR_DOMAIN.com with your actual domain
# 2. Place SSL cert at /etc/nginx/ssl/fullchain.pem
# 3. Place SSL key at /etc/nginx/ssl/privkey.pem
# 4. Replace docker/nginx/default.conf with this file
# 5. Rebuild: docker compose up -d --build
#
# For Let's Encrypt with Certbot, mount a volume for /var/www/certbot
# and use the certbot container pattern (see comments below).

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
  listen 80;
  server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

  # Let's Encrypt ACME challenge (if using certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS server ───────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

  # ── SSL Certificates ─────────────────────────────────────────
  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;

  # ── Modern TLS settings ──────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP Stapling
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;

  # ── Application root ─────────────────────────────────────────
  root /var/www/html/public;
  index index.php;
  charset utf-8;

  client_max_body_size 110M;
  client_body_buffer_size 512k;

  # ── Security headers ─────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ── Uploaded media ───────────────────────────────────────────
  location ^~ /uploads/ {
    alias /var/www/html/storage/uploads/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary "Accept";
  }

  # ── Static assets ────────────────────────────────────────────
  location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # ── PHP handling ─────────────────────────────────────────────
  location / {
    try_files $uri /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
    fastcgi_param HTTPS           on;

    # ── Real visitor IP forwarding (critical for GeoIP) ────────
    fastcgi_param REMOTE_ADDR          $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_REAL_IP       $remote_addr;

    fastcgi_read_timeout 120;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;

    fastcgi_pass app:9000;
  }

  # ── Hidden files ─────────────────────────────────────────────
  location ~ /\. {
    deny all;
  }

  # ── Gzip compression ────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
}