# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;

upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 110M;

    # Healthcheck endpoint (nginx-level)
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Static files (served by nginx directly)
    location /static/ {
        alias /app/frontend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Self-hosted fonts
    location /static/fonts/ {
        alias /app/frontend/staticfiles/fonts/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads
    location /uploads/ {
        alias /app/backend/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Block PHP execution in uploads
        location ~ \.php$ {
            deny all;
        }
    }

    # PWA files at root
    location = /manifest.json {
        alias /app/frontend/manifest.json;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /service-worker.js {
        alias /app/frontend/service-worker.js;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt {
        alias /app/frontend/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Admin login — strict rate limiting
    location = /admin/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    # API endpoints — moderate rate limiting
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    # Django admin
    location /django-admin/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    # All other requests — general rate limiting
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
