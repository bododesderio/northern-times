# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;

server {
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php;

  charset utf-8;
  server_tokens off;

  client_max_body_size 110M;
  client_body_buffer_size 512k;

  # ── Security headers ──────────────────────────────────────────
  # NOTE: Security headers (CSP, X-Frame-Options, X-Content-Type-Options,
  # Referrer-Policy, Permissions-Policy, X-XSS-Protection) are set by
  # PHP middleware (single source of truth) to avoid duplicate headers.

  # ── Block PHP execution in uploads ───────────────────────────
  location ~* /uploads/.*\.php$ {
    deny all;
    return 403;
  }

  # ── Uploaded media ────────────────────────────────────────────
  location ^~ /uploads/ {
    alias /var/www/html/storage/uploads/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary "Accept";
  }

  # ── Static assets (CSS, JS, images, fonts) ────────────────────
  location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # ── Login rate limiting ────────────────────────────────────────
  location = /admin/login {
    limit_req zone=login burst=3 nodelay;
    try_files $uri /index.php?$query_string;
  }

  # ── API rate limiting ──────────────────────────────────────────
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    try_files $uri /index.php?$query_string;
  }

  # ── Front controller ──────────────────────────────────────────
  location / {
    limit_req zone=general burst=20 nodelay;
    try_files $uri /index.php?$query_string;
  }

  # ── PHP processing ────────────────────────────────────────────
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;

    # ── Real visitor IP forwarding (critical for GeoIP) ─────────
    fastcgi_param REMOTE_ADDR          $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_REAL_IP       $remote_addr;

    fastcgi_connect_timeout 60;
    fastcgi_send_timeout 60;
    fastcgi_read_timeout 120;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;

    fastcgi_pass app:9000;
  }

  # ── Internal health check (no PHP, no logging) ───────────────
  location = /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  # ── Block hidden files ────────────────────────────────────────
  location ~ /\. {
    deny all;
  }

  # ── Gzip compression ─────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
}
