# Production nginx config with SSL/TLS
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;

upstream django {
    server django:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck (plain HTTP)
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 110M;

    # Static files
    location /static/ {
        alias /app/frontend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/fonts/ {
        alias /app/frontend/staticfiles/fonts/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads
    location /uploads/ {
        alias /app/backend/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        location ~ \.php$ { deny all; }
    }

    # PWA files
    location = /manifest.json { alias /app/frontend/manifest.json; add_header Cache-Control "public, max-age=86400"; }
    location = /service-worker.js { alias /app/frontend/service-worker.js; add_header Cache-Control "no-cache"; }
    location = /robots.txt { alias /app/frontend/robots.txt; add_header Cache-Control "public, max-age=86400"; }

    # Block hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Rate-limited routes
    location = /admin/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    location /django-admin/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/proxy_params_common;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
