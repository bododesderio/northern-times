{% load core_tags %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="color-scheme" content="light"></head>
<body style="margin:0;padding:0;background:#f4f4f2;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background:#fff;border:1px solid #e5e3df;">
        <tr><td style="padding:20px 32px;border-bottom:3px solid #D32F2F;">
          <span style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#D32F2F;">{{ site_name }} · Contact form</span>
        </td></tr>
        <tr><td style="padding:28px 32px;font-size:15px;line-height:1.6;color:#292524;">
          <p style="margin:0 0 16px;">A new message was submitted through the contact form:</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
            <tr><td style="padding:6px 0;color:#78716c;width:90px;">From</td><td style="padding:6px 0;">{{ msg.name|default:"—" }}</td></tr>
            <tr><td style="padding:6px 0;color:#78716c;">Email</td><td style="padding:6px 0;"><a href="mailto:{{ msg.email }}" style="color:#D32F2F;">{{ msg.email|default:"—" }}</a></td></tr>
            <tr><td style="padding:6px 0;color:#78716c;">Subject</td><td style="padding:6px 0;">{{ msg.subject|default:"—" }}</td></tr>
          </table>
          <div style="margin:16px 0 0;padding:16px;background:#faf9f7;border-left:3px solid #D32F2F;white-space:pre-wrap;font-size:14px;line-height:1.6;">{{ msg.message }}</div>
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #e5e3df;background:#faf9f7;font-size:12px;color:#a8a29e;">Sent by {{ site_name }} — internal notification.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
