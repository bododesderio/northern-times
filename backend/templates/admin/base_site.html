{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Northern Times Admin{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">Northern Times Admin</a></h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
/* ── Northern Times Django Admin Dark Theme ── */
:root {
    --primary: #417690;
    --secondary: #79aec8;
    --accent: #f5dd5d;
    --bg-dark: #1a1b1e;
    --bg-card: #22242a;
    --bg-hover: #2a2d35;
    --text-primary: #e8e8e8;
    --text-secondary: #a0a0a0;
    --border: #333640;
    --success: #4caf50;
    --error: #e74c3c;
    --warning: #f39c12;
    --info: #3498db;
}

/* Global */
body { background: var(--bg-dark) !important; color: var(--text-primary) !important; }
a:link, a:visited { color: var(--secondary) !important; }
a:hover { color: var(--accent) !important; }

/* Header */
#header { background: #0b1929 !important; color: #fff !important; }
#header a:link, #header a:visited { color: #fff !important; }
#branding h1, #branding h1 a { color: #fff !important; }
#user-tools { color: var(--text-secondary) !important; }
#user-tools a { color: var(--secondary) !important; }

/* Breadcrumbs */
div.breadcrumbs { background: #111318 !important; color: var(--text-secondary) !important; }
div.breadcrumbs a { color: var(--secondary) !important; }

/* Content area */
#content { background: transparent !important; }
#content-main { background: transparent !important; }

/* Modules/cards */
.module, .dashboard #content-related .module {
    background: var(--bg-card) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
}
.module h2, .module caption, .inline-group h2 {
    background: #111318 !important;
    color: var(--text-primary) !important;
    border-bottom: 1px solid var(--border) !important;
}

/* Tables */
table { border-collapse: collapse; }
#result_list table { background: var(--bg-card) !important; }
#result_list th { background: #111318 !important; color: var(--text-primary) !important; border-bottom: 2px solid var(--border) !important; }
#result_list th a { color: var(--text-primary) !important; }
#result_list td { border-bottom: 1px solid var(--border) !important; color: var(--text-primary) !important; }
#result_list tr:nth-child(odd) { background: var(--bg-card) !important; }
#result_list tr:nth-child(even) { background: #1e2028 !important; }
#result_list tr:hover td { background: var(--bg-hover) !important; }

/* Changelist */
#changelist { background: transparent !important; }
#changelist .actions { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: 4px !important; padding: 10px !important; }
#changelist-filter { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: 6px !important; }
#changelist-filter h2 { color: var(--text-primary) !important; }
#changelist-filter h3 { color: var(--text-secondary) !important; }
#changelist-filter li { color: var(--text-secondary) !important; }
#changelist-filter li.selected a { color: var(--accent) !important; font-weight: bold; }
#changelist-search { background: transparent !important; }

/* Forms */
input, select, textarea {
    background: #1e2028 !important;
    color: var(--text-primary) !important;
    border: 1px solid var(--border) !important;
    border-radius: 4px !important;
}
input:focus, select:focus, textarea:focus {
    border-color: var(--secondary) !important;
    outline: none;
}
.aligned label { color: var(--text-primary) !important; }
.help, .help-text { color: var(--text-secondary) !important; }
fieldset { border: 1px solid var(--border) !important; background: var(--bg-card) !important; border-radius: 6px !important; }
fieldset h2 { background: #111318 !important; color: var(--text-primary) !important; }

/* Buttons */
input[type="submit"], button, .submit-row input, .button, a.button {
    background: var(--primary) !important;
    color: #fff !important;
    border: none !important;
    border-radius: 4px !important;
    padding: 8px 16px !important;
}
input[type="submit"]:hover, button:hover, .button:hover {
    background: var(--secondary) !important;
}
.submit-row { background: var(--bg-card) !important; border-top: 1px solid var(--border) !important; }
input.default { background: var(--info) !important; }
a.deletelink, a.deletelink:visited { color: var(--error) !important; }

/* Status indicators (matching reference images) */
img[src*="icon-yes"] { filter: hue-rotate(80deg) brightness(1.5); }
img[src*="icon-no"] { filter: hue-rotate(320deg) brightness(1.2); }

/* Pagination */
.paginator { background: var(--bg-card) !important; border: 1px solid var(--border) !important; color: var(--text-primary) !important; }

/* Calendar/date widgets */
.calendarbox, .clockbox { background: var(--bg-card) !important; border: 1px solid var(--border) !important; }
.calendar td, .calendar th { color: var(--text-primary) !important; }
.calendar td.today { background: var(--primary) !important; }

/* Messages */
.messagelist li.success { background: #1a3a1a !important; color: var(--success) !important; }
.messagelist li.error { background: #3a1a1a !important; color: var(--error) !important; }
.messagelist li.warning { background: #3a3a1a !important; color: var(--warning) !important; }
.messagelist li.info { background: #1a2a3a !important; color: var(--info) !important; }

/* Dashboard */
.dashboard #content-related h3 { color: var(--text-primary) !important; }
.dashboard #content-related .module h2 { padding: 8px 12px !important; }
.dashboard .app-list caption { color: var(--text-primary) !important; }

/* Sidebar */
#content-related { background: transparent !important; }
#content-related .module { margin-bottom: 12px; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* Login page */
body.login { background: var(--bg-dark) !important; }
body.login #container { background: transparent !important; }
body.login #header { background: #0b1929 !important; }
</style>
{% endblock %}
