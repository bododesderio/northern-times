{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reset Password — {{ site_title|default:"Northern Times" }} Admin</title>
  <link rel="stylesheet" href="{% static 'fonts/fonts.css' %}"/>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Libre Franklin', system-ui, sans-serif; }
  .lp-wrap { display: flex; min-height: 100vh; width: 100%; }
  .lp-left { flex: 0 0 48%; background: #1a1b1e; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .lp-left-body { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 56px 52px; }
  .lp-masthead { text-align: center; }
  .lp-rule-top, .lp-rule-bot { height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,.25), transparent); margin: 12px 0; }
  .lp-nameplate { font-family: 'UnifrakturMaguntia', Georgia, serif; font-size: clamp(32px, 4vw, 52px); color: #f5f0e8; line-height: 1.1; }
  .lp-right { flex: 1; display: flex; align-items: center; justify-content: center; background: #1c1917; padding: 40px 24px; }
  .lp-form-wrap { width: 100%; max-width: 400px; animation: lpFadeUp .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes lpFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .lp-form-title { font-size: 26px; font-weight: 800; color: #fafafa; margin: 0 0 6px; }
  .lp-form-sub { font-size: 14px; color: #a8a29e; margin: 0 0 28px; }
  .lp-error { display: flex; align-items: center; gap: 8px; background: rgba(211,47,47,.15); border: 1px solid #D32F2F; color: #ffb3ac; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 500; margin-bottom: 20px; }
  .lp-form { display: flex; flex-direction: column; gap: 18px; }
  .lp-field { display: flex; flex-direction: column; gap: 7px; }
  .lp-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a8a29e; }
  .lp-input { width: 100%; padding: 12px 14px; border: 1.5px solid #292524; border-radius: 10px; background: #0c0a09; color: #fafafa; font-size: 15px; outline: none; }
  .lp-input:focus { border-color: #D32F2F; box-shadow: 0 0 0 3px rgba(211,47,47,.15); }
  .lp-input::placeholder { color: #78716c; }
  .lp-submit { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 20px; background: #D32F2F; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 700; margin-top: 4px; }
  .lp-submit:hover { background: #b71c1c; }
  .lp-foot { margin-top: 24px; text-align: center; }
  .lp-back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #78716c; text-decoration: none; }
  .lp-back-link:hover { color: #fafafa; }
  @media (max-width: 780px) { .lp-wrap { flex-direction: column; } .lp-left { display: none; } .lp-right { min-height: 100vh; } }
  </style>
</head>
<body>
<div class="lp-wrap">
  <div class="lp-left" aria-hidden="true">
    <div class="lp-left-body">
      <div class="lp-masthead">
        <div class="lp-rule-top"></div>
        <div class="lp-nameplate">{{ site_title|default:"Northern Times" }}</div>
        <div class="lp-rule-bot"></div>
      </div>
    </div>
  </div>

  <div class="lp-right">
    <div class="lp-form-wrap">
      <h1 class="lp-form-title">Set new password</h1>
      <p class="lp-form-sub">Choose a strong password (minimum 8 characters)</p>

      {% if error %}
        <div class="lp-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{% url 'admin_reset_password' token=token %}" class="lp-form">
        {% csrf_token %}

        <div class="lp-field">
          <label for="rpPassword" class="lp-label">New password</label>
          <input id="rpPassword" name="password" type="password" required autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" class="lp-input" minlength="8" autofocus>
        </div>

        <div class="lp-field">
          <label for="rpConfirm" class="lp-label">Confirm password</label>
          <input id="rpConfirm" name="password_confirmation" type="password" required autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" class="lp-input" minlength="8">
        </div>

        <button type="submit" class="lp-submit">
          Reset password
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="lp-foot">
        <a href="{% url 'admin_login' %}" class="lp-back-link">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to sign in
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
