# ═══════════════════════════════════════════════════════════════
#  PRODUCTION OVERRIDE — HTTPS with Let's Encrypt
#
#  Usage:
#    1. Set your domain in .env: APP_DOMAIN=northerntimes.co.ug
#    2. First run (obtain cert):
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#         run --rm certbot certonly --webroot -w /var/www/certbot \
#         -d $APP_DOMAIN -d www.$APP_DOMAIN --email admin@$APP_DOMAIN --agree-tos
#    3. After cert obtained, restart nginx:
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml restart web
#    4. Auto-renewal runs every 12 hours via the certbot service
#
#  Shorthand: alias dc="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
# ═══════════════════════════════════════════════════════════════

services:
  web:
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    # tmpfs overlays the base compose's bind-mount, allowing envsubst to write
    tmpfs:
      - /etc/nginx/conf.d:size=1m
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/production-ssl.conf:/tmp/ssl.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/nginx/ssl:ro
    # Process the SSL template with the domain, then start nginx
    command: /bin/sh -c "envsubst '$$APP_DOMAIN' < /tmp/ssl.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--no-check-certificate", "https://localhost:443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  certbot:
    image: certbot/certbot:latest
    container_name: northern_times_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - northern_times
    # Auto-renew every 12 hours (certbot exits cleanly if not due)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # Remove pgAdmin in production
  pgadmin:
    profiles:
      - debug

volumes:
  certbot_www:
  certbot_certs:
